plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'net.atlasvisuals'
base { archivesName = 'atlas-visuals' }

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // gradlew runClientGameTest -PtestMods="a.jar;b.jar" adds real mods (Sodium, Mod Menu) to the test run.
    if (project.hasProperty('testMods')) {
        localRuntime files(project.testMods.split(';'))
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'atlas_visuals_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '5000']
}

java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

jar { from('LICENSE') { rename { "LICENSE_atlas_visuals" } } }
